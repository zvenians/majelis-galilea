name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Apps Script Syntax & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Clasp configuration
        run: cp .clasp.json.example .clasp.json

      - name: Run Apps Script manifest and syntax validation
        run: node scripts/validate-gas.js