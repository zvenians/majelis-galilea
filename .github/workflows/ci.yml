name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Apps Script Syntax & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Prepare Clasp configuration
        run: cp .clasp.json.example .clasp.json

      - name: Run Apps Script manifest and syntax validation
        run: node scripts/validate-gas.js

      - name: Check publication and account access
        run: node scripts/test-governance.js

      - name: Check simplified meeting and budget workflow
        run: node scripts/test-simple-workflow.js

      - name: Check data access and login protection
        run: node scripts/test-access-boundaries.js

      - name: Check modular frontend assets and public caching
        run: node scripts/test-frontend-structure.js
